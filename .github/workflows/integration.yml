name: Trusted Oracle and native evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-target:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: apexrest-integration
    runs-on: [self-hosted, apexrest-trusted]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:dry-run
      # Runner-owned environment supplies named connections, private policy, target,
      # exact identity, preinstalled SQLcl/Java/Codex and authenticated browser state.
      # Never schedule this runner for pull_request or untrusted refs.
      - run: npm run test:repository-plugin
      - run: npm run composer:verify
      - run: node scripts/oracle-smoke.mjs
      - run: npm run test:integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-integration-evidence
          path: docs/evidence/
          retention-days: 3
