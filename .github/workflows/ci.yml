name: Local quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-packages:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-12
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run composer:check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run plugin:check
      - run: npm run test:contracts
      - run: npm run test:installers
      - run: npm run site:build
      - run: npm run test:packaging
      - run: npm run release:dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-beta-${{ matrix.os }}
          path: dist/releases/
          retention-days: 7
