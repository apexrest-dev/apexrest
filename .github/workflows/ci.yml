name: Local quality gates
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-packages:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: ['24.21.0']
        # Engines allow Node >=24 <27; check the newest supported major on Linux only.
        include:
          - os: ubuntu-latest
            node: '26.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-12
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ matrix.node == '26.x' }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run composer:check
      - run: npm run build
      - run: npm run test:unit
      - name: Report skipped real-JAR ORDS tests
        if: always()
        shell: bash
        run: |
          if [ -n "${APEXREST_TEST_SQLCL_HOME:-}" ] || command -v sql >/dev/null 2>&1; then
            echo "SQLcl is available; ORDS bridge/protocol tests ran when their SQLcl JARs and javac were present." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=ORDS JAR tests skipped::SQLcl is not installed on this runner; real-JAR tests in tests/unit/ords-bridge.test.ts and tests/unit/ords-protocol.test.ts were skipped."
            echo "**ORDS JAR tests skipped:** SQLcl is not installed on this hosted runner, so the real-JAR tests in \`tests/unit/ords-bridge.test.ts\` and \`tests/unit/ords-protocol.test.ts\` were skipped. This run is not ORDS/SQLcl evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run plugin:check
      - run: npm run test:contracts
      - run: npm run test:installers
      - run: npm run site:build
      - run: npm run test:packaging
      - run: npm run release:dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-beta-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/releases/
          retention-days: 7
